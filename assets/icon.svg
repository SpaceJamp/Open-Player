<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Open Player: a play button whose blocky left edge resolves into a smooth shape (upscaling) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2540"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(14 0)"><!-- centres the artwork, which spans x 25..197 -->
  <!-- smooth play triangle -->
  <path d="M112 76 L112 180 L192 128 Z" fill="url(#play)" stroke="url(#play)" stroke-width="10" stroke-linejoin="round"/>
  <!-- low-res pixels trailing off the left edge, fading as they get blockier -->
  <g fill="#22d3ee">
    <rect x="84" y="92" width="20" height="20" rx="3" opacity="0.85"/>
    <rect x="84" y="118" width="20" height="20" rx="3" opacity="0.85"/>
    <rect x="84" y="144" width="20" height="20" rx="3" opacity="0.85"/>
    <rect x="56" y="104" width="20" height="20" rx="3" opacity="0.5"/>
    <rect x="56" y="132" width="20" height="20" rx="3" opacity="0.5"/>
    <rect x="30" y="118" width="18" height="18" rx="3" opacity="0.25"/>
  </g>
  </g>
</svg>
